on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy pipeline
        run: docker build -t myapp:${{ github.sha }} .

      - name: Import image into k3d
        run: k3d image import myapp:${{ github.sha }} -c mycluster