on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t ghcr.io/yagachill/docker-lab:${{ github.sha }} .

      - name: Push image to GHCR
        run: docker push ghcr.io/yagachill/docker-lab:${{ github.sha }}

      - name: Import image into k3d
        run: k3d image import ghcr.io/yagachill/docker-lab:${{ github.sha }} -c mycluster