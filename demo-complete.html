<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps-intervjue</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #1b1035 0%, #0a0518 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
    animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .message h1 {
    margin: 0;
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.5), 0 0 60px rgba(255, 100, 255, 0.4);
    letter-spacing: 0.02em;
  }

  .message p {
    margin-top: 0.5rem;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    color: rgba(255, 255, 255, 0.7);
  }

  @keyframes pop {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    60% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<canvas id="fx"></canvas>

<div class="message">
  <h1>new version without error</h1>
  <p></p>
</div>

<script>
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const colors = ['#ff3cac', '#784ba0', '#2b86c5', '#ffd93d', '#6bff8f', '#ff6b6b', '#ffffff'];

  class Particle {
    constructor(x, y, color) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 5;
      this.x = x;
      this.y = y;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.color = color;
      this.life = 1;
      this.decay = 0.008 + Math.random() * 0.015;
      this.size = 2 + Math.random() * 2.5;
      this.gravity = 0.04;
    }
    update() {
      this.vy += this.gravity;
      this.vx *= 0.99;
      this.vy *= 0.99;
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
    }
    draw() {
      ctx.globalAlpha = Math.max(this.life, 0);
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  let particles = [];

  function launchFirework() {
    const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
    const y = Math.random() * canvas.height * 0.4 + canvas.height * 0.1;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const count = 60 + Math.floor(Math.random() * 40);
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(x, y, color));
    }
  }

  function animate() {
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(10, 5, 24, 0.25)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => { p.update(); p.draw(); });
    particles = particles.filter(p => p.life > 0);

    requestAnimationFrame(animate);
  }

  // Initial burst
  for (let i = 0; i < 5; i++) {
    setTimeout(launchFirework, i * 300);
  }

  // Keep launching fireworks periodically
  setInterval(launchFirework, 900);

  animate();
</script>

</body>
</html>
